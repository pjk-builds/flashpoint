services:
  flashpoint:
    build: .
    restart: unless-stopped
    networks:
      - app
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      RATE_LIMIT_RPS: "5000"
      RATE_LIMIT_BURST: "1000"
      MAX_IN_FLIGHT: "64"
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  app:
    name: ${FLASHPOINT_NETWORK:-flashpoint_default}
    external: ${FLASHPOINT_NETWORK_EXTERNAL:-false}
